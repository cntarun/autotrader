name: ci
on:
  push: { branches: [main, "autotrader-*"] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-autotrader.txt }
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements-autotrader.txt pytest
      - name: Offline tests (tiny random model, synthetic data - no network, no keys)
        run: python -m pytest tests/test_autotrader.py -q
      - name: Validate configs
        run: for f in deploy/config/*.yaml; do python -c "from autotrader.config import load_config; load_config('$f')"; done
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile, push: false, tags: "kronos-autotrader:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
