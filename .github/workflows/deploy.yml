# Tag v* -> build multi-arch image -> (manual approval) -> roll out via AWS SSM. No SSH.
# Requires: repo variable AWS_DEPLOY_ROLE_ARN, AWS_REGION, KRONOS_INSTANCE_ID and a
# `production` environment with required reviewers.
name: deploy
on:
  push: { tags: ["v*"] }
permissions: { contents: read, packages: write, id-token: write }
jobs:
  image:
    runs-on: ubuntu-latest
    outputs: { image: "${{ steps.meta.outputs.image }}" }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-autotrader:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  rollout:
    needs: image
    runs-on: ubuntu-latest
    environment: production          # manual approval gate
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Roll out (keeps state volume; previous tag is the rollback target)
        run: |
          aws ssm send-command --instance-ids "${{ vars.KRONOS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript --comment "deploy ${{ github.ref_name }}" \
            --parameters commands='[
              "set -e", "cd /opt/kronos && git fetch --depth 1 origin ${{ github.ref_name }} && git checkout -q FETCH_HEAD",
              "cd deploy && sed -i \"s#^KRONOS_IMAGE=.*#KRONOS_IMAGE=${{ needs.image.outputs.image }}#\" .env.base",
              "/usr/local/bin/kronos-render-env ${{ vars.AWS_REGION }}",
              "docker compose pull bot && docker compose up -d bot",
              "sleep 90 && curl -fsS http://127.0.0.1:9108/healthz || (echo HEALTHCHECK FAILED; exit 1)"
            ]' --query Command.CommandId --output text
