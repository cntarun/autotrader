# Free paper trading on GitHub-hosted runners: one decision 5 min after each 4h candle.
# State (positions, fills ledger, decisions log) is committed to the `paper-state` branch.
# No exchange keys are used or needed. Pause: Actions tab -> paper-trade -> Disable workflow.
name: paper-trade
on:
  # schedule: [{ cron: "5 */4 * * *" }]   # off: the Kronos signal failed the Oct 2026 backtest (docs/BACKTEST_RESULTS.md)
  workflow_dispatch:
concurrency: { group: paper-trade, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KRONOS_MODE: paper
      KRONOS_STATE_DIR: state
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Load state branch (git worktree at ./state)
        run: |
          git config user.name "kronos-paper-bot"
          git config user.email "kronos-paper-bot@users.noreply.github.com"
          if git ls-remote --exit-code origin paper-state >/dev/null; then
            git fetch --depth 1 origin paper-state:refs/remotes/origin/paper-state
            git worktree add -B paper-state state origin/paper-state
          else
            git worktree add --orphan -b paper-state state
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-autotrader.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-kronos-small-901c26c-0e01173 }
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements-autotrader.txt
      - name: Decide & paper-trade
        run: python -m autotrader.run --config deploy/config/${{ vars.KRONOS_PAPER_CONFIG || 'config.example.yaml' }} --once
      - name: Save state
        if: always()
        working-directory: state
        run: |
          rm -f .lock
          git add -A
          git commit -qm "paper cycle $(date -u +%FT%TZ)" || echo "no changes"
          git push -q origin HEAD:paper-state
